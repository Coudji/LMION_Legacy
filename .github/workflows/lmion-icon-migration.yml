name: LMION icon migration

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/lmion-icon-migration.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Extract standalone PNG icons
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import io
          import struct

          root = Path("Contents/mods/LMION_Build/42")
          pack = root / "media/texturepacks/LMIONBuildIcons.pack"
          textures = root / "media/textures"
          mod_info = root / "mod.info"

          if not pack.exists():
              print("LMIONBuildIcons.pack is already absent; nothing to migrate.")
              raise SystemExit(0)

          names = [
              "LMION_IndustrialGarageDoor", "LMION_GreenGarageDoor", "LMION_WhiteGarageDoor", "LMION_GreyGarageDoor",
              "LMION_RollingGarageDoor", "LMION_RedWindowGarageDoor", "LMION_RollingWindowGarageDoor", "LMION_FarmDoubleGate",
              "LMION_WroughtIronDoubleGate", "LMION_WoodenFenceDoubleGate", "LMION_BlackGlassDoubleDoorLeft", "LMION_BlackGlassDoubleDoorRight",
              "LMION_GreyMetalDoubleDoorLeft", "LMION_GreyMetalDoubleDoorRight", "LMION_YellowMetalDoubleDoorLeft", "LMION_YellowMetalDoubleDoorRight",
              "LMION_BlueChurchDoubleDoorLeft", "LMION_BlueChurchDoubleDoorRight", "LMION_BrownChurchDoubleDoorLeft", "LMION_BrownChurchDoubleDoorRight",
              "LMION_BrownSlidingGlassDoor", "LMION_WhiteSlidingGlassDoor", "LMION_TallWoodenFenceGate", "LMION_TallWroughtIronGate",
              "LMION_SmallMetalFenceGate", "LMION_SmallWhiteWoodenFenceGate", "LMION_SmallBlueDoor", "LMION_SmallPinkDoor",
              "LMION_SmallBrownPanelDoor", "LMION_SmallWhitePanelDoor", "LMION_SmallBlackPanelDoor", "LMION_WhiteWoodenDoor",
              "LMION_BlueRestroomDoor", "LMION_OuthouseDoor", "LMION_CherryDoor", "LMION_TanDoorWithWindow",
              "LMION_BlackDoorWithWindow", "LMION_BlueMetalDoor", "LMION_RoughWoodenDoor", "LMION_SecurityDoor",
              "LMION_ChestnutGlassDoor", "LMION_BlackGlassDoor", "LMION_WhiteDoorWithWindows", "LMION_BlackTwoPaneDoor",
              "LMION_BrownDoor", "LMION_WhiteMetalDoor", "LMION_WhiteMetalDoorWithWindow", "LMION_TanMetalDoor",
              "LMION_WoodenDoor", "LMION_BlueDoor", "LMION_BlackMetalDoor", "LMION_BrownDoorWithWindows",
              "LMION_RedMetalDoor", "LMION_JailDoor", "LMION_PileOCrepeBlueDoorWithWindow", "LMION_PileOCrepeOrangeDoor",
              "LMION_PizzaWhirledBrownGlassDoor", "LMION_PizzaWhirledGreenMetalDoor", "LMION_SeaHorseGlassDoor", "LMION_SpiffosGlassDoor",
              "LMION_SpiffosRedMetalDoor", "LMION_FossoilDoor", "LMION_Gas2GoDoor", "LMION_LogDoor",
          ]

          if len(names) != 64:
              raise RuntimeError(f"Unexpected icon name count: {len(names)}")

          raw = pack.read_bytes()
          signature = b"\x89PNG\r\n\x1a\n"
          offsets = []
          start = 0
          while True:
              pos = raw.find(signature, start)
              if pos < 0:
                  break
              offsets.append(pos)
              start = pos + 1

          if not offsets:
              raise RuntimeError("No embedded PNG found in LMIONBuildIcons.pack")

          candidates = []
          for offset in offsets:
              try:
                  cursor = offset + len(signature)
                  while cursor + 12 <= len(raw):
                      length = struct.unpack(">I", raw[cursor:cursor + 4])[0]
                      chunk_type = raw[cursor + 4:cursor + 8]
                      cursor += 12 + length
                      if chunk_type == b"IEND":
                          image = Image.open(io.BytesIO(raw[offset:cursor])).convert("RGBA")
                          candidates.append(image)
                          break
              except Exception as exc:
                  print(f"Skipping PNG candidate at {offset}: {exc}")

          if not candidates:
              raise RuntimeError("Embedded PNG signature found, but no valid PNG could be decoded")

          atlas = max(candidates, key=lambda image: image.width * image.height)
          print(f"Using atlas {atlas.width}x{atlas.height}")

          if atlas.width % 8 != 0 or atlas.height % 8 != 0:
              raise RuntimeError(f"Atlas is not an 8x8 grid: {atlas.size}")

          cell_w = atlas.width // 8
          cell_h = atlas.height // 8
          textures.mkdir(parents=True, exist_ok=True)

          for index, name in enumerate(names):
              x = (index % 8) * cell_w
              y = (index // 8) * cell_h
              icon = atlas.crop((x, y, x + cell_w, y + cell_h))
              if icon.getbbox() is None:
                  raise RuntimeError(f"Empty icon cell {index}: {name}")
              icon.save(textures / f"{name}.png", "PNG", optimize=True)

          info_lines = mod_info.read_text(encoding="utf-8").splitlines()
          info_lines = [line for line in info_lines if line.strip() != "pack=LMIONBuildIcons"]
          mod_info.write_text("\n".join(info_lines) + "\n", encoding="utf-8")

          pack.unlink()
          print(f"Created {len(names)} standalone PNG icons in {textures}")
          PY

      - name: Commit migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes to commit."
            exit 0
          fi
          git commit -m "refactor: use standalone PNG build icons"
          git push origin HEAD:main
